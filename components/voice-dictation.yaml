id: voice-dictation
name: Voice dictation (local Whisper, push-to-talk)
kind: tool
summary: Tap Right Alt, talk, tap again to paste the transcript anywhere; Right Ctrl while dictating sends it into Claude's prompt box.
default: ask

platforms:
  linux: "supported on the setup it was built for: GNOME on Wayland, PipeWire, systemd, kanata, NVIDIA GPU"
  windows: "supported with dictate_windows.py: NVIDIA GPU; no kanata needed"
  macos: unsupported

requires: [kanata] # Linux only; the Windows version reads the keys itself
needs:
  - "NVIDIA GPU with CUDA (dictate.py loads Whisper with device=\"cuda\"). Without one it would need editing to device=\"cpu\", compute_type=\"int8\": several times slower."
  - "GNOME (uses Super+N dock shortcuts to focus Claude; Claude pinned in the first 10 dock slots, dock number hotkeys off)"
  - "Linux: PipeWire (pw-record, pw-dump), systemd user services"
  - "uv or python3-venv to build the venv"
  - "Windows: Python 3 with tkinter, and a current NVIDIA driver"

cost:
  disk: "~4.2 GB on Linux; ~3.7 GB on Windows (2.2 GB venv with CUDA libs + 1.5 GB Whisper large-v3-turbo model)"
  ram: "~2-3 GB VRAM while loaded; a background service runs all session"
  other: "Linux: edits the kanata config. Windows: takes over Right Alt everywhere, and adds a Startup shortcut"

detect_installed:
  linux: "systemctl --user is-enabled voice-dictation"
  windows: "Test-Path \"$([Environment]::GetFolderPath('Startup'))\\Voice Dictation.lnk\""

built_in_alternatives:
  windows:
    what: "Windows voice typing (Win+H)"
    check: "always present on Windows 10/11; Settings → Time & language → Speech for language"
    gap: "No key that drops the text straight into Claude's prompt box (click there first, then Win+H). Uses Microsoft's online recognition by default. Otherwise close in quality, and it costs 0 GB."
  macos:
    what: "Dictation (press Fn/🌐 twice)"
    check: "System Settings → Keyboard → Dictation"
    gap: "Same as Windows: no send-to-Claude key; you focus the box yourself."
  linux:
    what: "Nothing built in on GNOME. Alternatives: nerd-dictation (Vosk, ~50 MB-2 GB, CPU-only, lower accuracy), or a smaller Whisper model (edit MODEL in dictate.py: \"small\" ~0.5 GB, \"base\" ~150 MB)."
    check: "n/a"
    gap: "Smaller models are faster on CPU but make more mistakes."

worth_it_when: "NVIDIA GPU and 5+ GB free disk, on Linux with GNOME or on Windows."
skip_when: "macOS (use the built-in one), no NVIDIA GPU, tight on disk, or Windows if Win+H is good enough."

install:
  linux:
    - "git clone https://github.com/davidj24/voice-dictation.git ~/projects/Claude/voice-dictation (the service file hardcodes this path)"
    - "cd there; build the venv with faster-whisper + nvidia-cublas-cu12 + nvidia-cudnn-cu12 (see its README; uv venv .venv && uv pip install ...)"
    - "Download the model into ./models (first run downloads it; run once without HF_HUB_OFFLINE=1, or huggingface-cli download mobiuslabsgmbh/faster-whisper-large-v3-turbo --cache-dir models)"
    - "Merge kanata-voice.kbd pieces into ~/Kanata/kanata.kbd (the kanata component's copy already has them) and make sure kanata runs with --port 127.0.0.1:7070"
    - "ln -s ~/projects/Claude/voice-dictation/voice-dictation.service ~/.config/systemd/user/ && systemctl --user daemon-reload && systemctl --user enable --now voice-dictation"
    - "Pin Claude in the GNOME dock's first 10 slots; turn off the dock's own number hotkeys"
  windows:
    - "git clone https://github.com/davidj24/voice-dictation.git $HOME\\projects\\Claude\\voice-dictation"
    - "cd there; py -m venv .venv; .venv\\Scripts\\python.exe -m pip install faster-whisper sounddevice pyperclip nvidia-cublas-cu12 nvidia-cudnn-cu12"
    - "Download the model once by running .venv\\Scripts\\python.exe -c \"import dictate_windows as d; d.load_model()\" (first run downloads it into ./models)"
    - "Add a Startup-folder shortcut named Voice Dictation that runs .venv\\Scripts\\pythonw.exe dictate_windows.py in that folder, then start it once"

verify:
  linux: "journalctl --user -u voice-dictation -n 20 shows 'loading large-v3-turbo' and no errors; tap Right Alt, say a few words, tap again."
  windows: "%LOCALAPPDATA%\\voice-dictation\\dictate.log shows 'ready'; tap Right Alt, say a few words, tap again."

update: "Linux: git -C ~/projects/Claude/voice-dictation pull --ff-only && systemctl --user restart voice-dictation. Windows: git pull there, then sign out and back in."
uninstall: "Linux: ~/projects/Claude/voice-dictation/uninstall.sh. Windows: stop the pythonw.exe running dictate_windows.py, delete the Startup shortcut and the voice-dictation folder."
notes: "Headset handling (switching Bluetooth to headset mode for the mic) assumes a bluez card; other mics work without it."
